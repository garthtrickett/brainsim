name: V3 slopewin validation
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: v3-slopewin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  slopewin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python check_v3_slopewin.py --evidence results/v3-slopewin --reproduce
      - run: python report_v3_slopewin.py --check
