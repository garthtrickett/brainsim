name: V1 validation
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scientific-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python check_evidence.py
      - run: python check_v1.py
      - run: python check_reference.py --out results/ci-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-evidence
          path: results/ci-reference.json
