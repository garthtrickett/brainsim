name: V4 robust validation
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: v4-robust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  robust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python check_v4_robust.py --evidence results/v4-robust --reproduce
      - run: python report_v4_robust.py --check
