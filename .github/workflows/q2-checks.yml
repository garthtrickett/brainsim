name: Q2 tau validation
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: q2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  q2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python check_reference.py --out results/local-reference.json
      - run: python check_q2.py --evidence results/q2 --reproduce
      - run: python report_q2.py --check
