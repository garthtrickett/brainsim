name: V3 validation
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python check_v3_gate.py --evidence results/v3 --reproduce
      - run: python report_v3_gate.py --check
